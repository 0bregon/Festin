<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios</title>
    <link href="estilo.css" rel="stylesheet">

    <script src="script.js" defer></script>
</head>
<body>


    <section class="galeria-contenedor" aria-roledescription="carrusel" aria-label="Galería de fotos de productos">
        <div class="controles-galeria">
            <button class="flecha anterior" aria-label="Imagen anterior" aria-controls="diapositivas-carrusel">&#10094;</button>
            <button class="flecha siguiente" aria-label="Siguiente imagen" aria-controls="diapositivas-carrusel">&#10095;</button>
        </div>

        <ul id="diapositivas-carrusel" class="galeria-pantalla" aria-live="polite">
            
            <li class="slide activa" role="group" aria-roledescription="diapositiva" aria-label="1 de 3">
            <figure>
                <img src="https://saketos.es/wp-content/uploads/2025/03/ninas-de-un-ano-3-1-jpg.webp" alt="Mesa de cumpleaños">
                <figcaption class="descripcion-foto">Primer cumpleaños</figcaption>
            </figure>
            </li>

            <li class="slide" role="group" aria-roledescription="diapositiva" aria-label="2 de 3">
            <figure>
                <img src="https://img1.elyerromenu.com/images/lisy-decoraciones/decoracion-cumpleanos-nina/img.webp" alt="Fiesta de cumpleaños con temática de Moana">
                <figcaption class="descripcion-foto">Decoración de Moana</figcaption>
            </figure>
            </li>
        </ul>
    </section>

</body>
</html>
