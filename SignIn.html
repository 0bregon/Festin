<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Festín</title>
    <link href="estilo.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="encabezado">
        <h1>
            <a href="index.html">
                <img src="Logo.png" alt="Festín" class="logo">
            </a>
        </h1> 
    </header>

    <main class="contenedor-login">

        <section class="seccion">
            <h2>Iniciar Sesión</h2>
            <p>Accede a tu cuenta para gestionar tus reservas y pedidos en Festín.</p>
            
            <form action="perfil.html" method="POST" class="formulario-login">

                <div class="grupo-campo">
                    <label for="email">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="ejemplo@email.com" 
                        autocomplete="email" 
                        required
                    >
                </div>

                <div class="grupo-campo">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        autocomplete="current-password" 
                        required
                    >
                </div>

                <button type="submit" class="boton-enviar">Ingresar</button>

            </form>

            <p class="registro-link">
                ¿No tienes cuenta? <a href="SignUp.html">Crear una cuenta</a>
            </p>
        </section>

    </main>

    <footer>
        <p><small>&copy; 2026 Festín Panamá. Todos los derechos reservados.</small></p>
    </footer>

</body>
</html>
