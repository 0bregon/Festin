<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="estilo.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="encabezado">
        <h1>
            <a href="index.html">
                <img src="Logo.png" alt="Festín" class="logo">
            </a>
        </h1> 
    </header>

    <main class="contenedor-login">

        <section class="seccion">
            <h2>Iniciar Sesión</h2>
            <p>Accede a tu cuenta para gestionar tus reservas y pedidos en Festín.</p>
            
            <!-- ✅ FORMULARIO CORREGIDO: sin action, con IDs correctos -->
            <form id="form-login" class="formulario-login">

                <div class="grupo-campo">
                    <label for="login-email">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="login-email" 
                        name="email" 
                        placeholder="ejemplo@email.com" 
                        autocomplete="email" 
                        required
                    >
                </div>

                <div class="grupo-campo">
                    <label for="login-pass">Contraseña</label>
                    <input 
                        type="password" 
                        id="login-pass" 
                        name="password" 
                        autocomplete="current-password" 
                        required
                        minlength="6"
                    >
                </div>

                <button type="submit" class="boton-enviar">Ingresar</button>

            </form>

            <p class="registro-link">
                ¿No tienes cuenta? <a href="SignUp.html">Crear una cuenta</a>
            </p>

            <!-- Panel de usuario logueado (se muestra después del login) -->
            <div id="panel-usuario" style="display:none; margin-top:20px; text-align:center; padding:15px; background:#e1f5fe; border-radius:10px; border:2px solid #4dd0e1;">
                <p style="margin-bottom:10px;">👤 <strong id="nombre-usuario"></strong></p>
                <p style="font-size:0.9rem; color:#666; margin-bottom:15px;" id="email-usuario"></p>
                <button id="btn-cerrar-sesion" class="boton-enviar" style="background:#ff6b6b; border-color:#e55a5a; box-shadow:0 4px 0 #c0392b;">Cerrar sesión</button>
            </div>

        </section>

    </main>

    <footer>
        <p><small>&copy; 2026 Festín Panamá. Todos los derechos reservados.</small></p>
    </footer>

</body>
</html>
