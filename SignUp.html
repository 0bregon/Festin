<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="estilo.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="encabezado">
        <h1>
            <a href="index.html">
                <img src="Logo.png" alt="Festín" class="logo">
            </a>
        </h1> 
    </header>

    <main class="contenedor-login">

        <section class="seccion">
            <h2>Crear Cuenta</h2>
            <p>Regístrate para gestionar tus reservas y pedidos de forma rápida.</p>

            <form action="perfil.html" method="POST" class="formulario-login">

                <div class="grupo-campo">
                    <label for="nombre">Nombre completo</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        placeholder="Tu nombre y apellido" 
                        autocomplete="name" 
                        required
                    >
                </div>

                <div class="grupo-campo">
                    <label for="email">Correo electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="ejemplo@email.com" 
                        autocomplete="email" 
                        required
                    >
                </div>

                <div class="grupo-campo">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        autocomplete="new-password" 
                        required
                    >
                </div>

                <div class="grupo-campo">
                    <label for="confirmar">Confirmar contraseña</label>
                    <input 
                        type="password" 
                        id="confirmar" 
                        name="confirmar" 
                        autocomplete="new-password" 
                        required
                    >
                </div>

                <button type="submit" class="boton-enviar">Crear cuenta</button>

            </form>

            <p class="registro-link">
                ¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a>
            </p>
        </section>

    </main>

    <footer>
        <p><small>&copy; 2026 Festín Panamá. Todos los derechos reservados.</small></p>
    </footer>

</body>
</html>
